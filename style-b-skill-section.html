<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skill — Style B</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --cream:#f3ece2;
  --ink:#171512;
  --gold:#b5893f;
  --gold-soft:#c9a76b;
  --dark:#141210;
  --line:rgba(23,21,18,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',sans-serif;background:var(--cream);color:var(--ink);word-break:keep-all}
.inner{max-width:1320px;margin:0 auto;padding:0 60px}

/* ---------- skill (standalone) ---------- */
.skill{background:var(--cream);padding:40px 0 120px}
.skill .lbl{font-size:13px;font-weight:800;letter-spacing:.2em;color:var(--gold);margin-bottom:14px}
.skill h2{font-size:clamp(34px,4vw,52px);font-weight:800;line-height:1.15;margin-bottom:56px}
.skill-list{display:grid;grid-template-columns:repeat(3,1fr);border-top:1.5px solid var(--ink)}
.skill-item{padding:32px 28px 36px 0;border-bottom:1px solid var(--line)}
.skill-item + .skill-item{padding-left:28px;border-left:1px solid var(--line)}
.skill-item:nth-child(3n+1){padding-left:0;border-left:0}
.skill-item .num{font-size:13px;font-weight:800;letter-spacing:.2em;color:var(--gold);margin-bottom:18px}
.skill-item h3{font-size:24px;font-weight:800;margin-bottom:12px}
.skill-item p{font-size:15px;line-height:1.7;color:rgba(23,21,18,.72);margin-bottom:20px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--gold-soft);color:var(--dark);font-size:12px;font-weight:700;padding:5px 10px;border-radius:2px}

@media(max-width:960px){
  .skill-list{grid-template-columns:1fr}
  .skill-item,.skill-item + .skill-item{padding:28px 0;border-left:0}
}
@media(max-width:600px){
  .inner{padding:0 20px}
}
</style>
</head>
<body>

<section class="skill">
  <div class="inner">
    <div class="lbl">SKILL</div>
    <h2>할 수 있는 것들</h2>
    <div class="skill-list">
      <div class="skill-item">
        <div class="num">01 — FRONTEND</div>
        <h3>화면 만들기</h3>
        <p>시맨틱한 마크업과 CSS로 읽기 좋은 레이아웃을 만듭니다.</p>
        <div class="tags"><span class="tag">HTML</span><span class="tag">CSS</span><span class="tag">JavaScript</span></div>
      </div>
      <div class="skill-item">
        <div class="num">02 — BACKEND</div>
        <h3>데이터 연결</h3>
        <p>간단한 데이터베이스와 인증을 붙여 실제로 동작하는 서비스를 완성합니다.</p>
        <div class="tags"><span class="tag">Supabase</span><span class="tag">Git · GitHub</span></div>
      </div>
      <div class="skill-item">
        <div class="num">03 — WORKFLOW</div>
        <h3>AI와 함께 만들기</h3>
        <p>AI 도구로 아이디어를 빠르게 시안으로 만들고 반복해서 다듬습니다.</p>
        <div class="tags"><span class="tag">Claude Code</span><span class="tag">반응형 레이아웃</span></div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
