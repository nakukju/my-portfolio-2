<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한유조 — Portfolio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --bg:#f3f1ec; --ink:#161513; --ink-soft:#6b675f; --line:#e6e2d9; --card:#ffffff;
  --pill-bg:#e9e5db; --accent:#161513;
  --content: 1360px; --gut:20px;
  --sp1:5px; --sp2:10px; --sp3:20px; --sp4:30px; --sp5:40px; --sp6:60px; --sp7:80px; --sp8:100px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.shell{max-width:var(--content);margin:0 auto;padding:0 5%}

.pill{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;background:var(--pill-bg);color:var(--ink-soft);padding:8px 18px;border-radius:999px;margin-bottom:var(--sp3)}
.card{background:var(--card);border-radius:22px;box-shadow:0 2px 10px rgba(22,21,19,.05);padding:var(--sp5)}

.reveal{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s ease}
.reveal.in{opacity:1;transform:translateY(0)}

/* ---------- header ---------- */
header.site{position:sticky;top:0;z-index:50;background:rgba(243,241,236,.9);backdrop-filter:blur(8px)}
header.site .shell{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:78px}
.logo{font-size:18px;font-weight:800}
nav.main{display:flex;gap:var(--sp5)}
nav.main a{font-size:14px;color:var(--ink-soft);font-weight:500}
nav.main a:hover{color:var(--ink)}
.cta-btn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:12px 20px;border-radius:999px;justify-self:end}

/* ---------- hero ---------- */
.hero{padding:var(--sp6) 0 var(--sp7);text-align:center}
.hero h1{font-size:clamp(30px,4.4vw,48px);font-weight:800;letter-spacing:-.02em;line-height:1.3;max-width:760px;margin:0 auto var(--sp4)}
.hero p{font-size:15px;color:var(--ink-soft);max-width:480px;margin:0 auto var(--sp5)}
.hero .cta-row{display:flex;gap:var(--sp2);justify-content:center;margin-bottom:var(--sp7)}
.btn{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:700;padding:13px 24px;border-radius:999px}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(22,21,19,.06)}
.visual-card{overflow:hidden;aspect-ratio:21/9;padding:0}
.visual-card img{width:100%;height:100%;object-fit:cover}

/* ---------- bento grid ---------- */
.sec{padding:var(--sp7) 0}
.sec-center{text-align:center;margin-bottom:var(--sp6)}
.sec-center h2{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.01em}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gut)}

/* ---------- project (준비 중) ---------- */
.b-empty{grid-column:span 12;padding:var(--sp8) var(--sp5);text-align:center}
.b-empty h3{font-size:22px;font-weight:800;margin-bottom:8px}
.b-empty p{font-size:14px;color:var(--ink-soft)}

/* ---------- contact ---------- */
.b-contact-copy{grid-column:1/span 5;display:flex;flex-direction:column;justify-content:center}
.b-contact-copy h3{font-size:26px;font-weight:800;line-height:1.4;margin-bottom:var(--sp3)}
.b-contact-copy p{font-size:14.5px;color:var(--ink-soft)}
.b-contact-form{grid-column:6/span 7}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp3);margin-bottom:var(--sp3)}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}
.field input, .field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-family:inherit;font-size:14px;background:var(--bg)}
.field input:focus, .field textarea:focus{outline:none;border-color:var(--ink)}
.field{margin-bottom:var(--sp3)}

/* ---------- footer ---------- */
footer.site{padding:var(--sp2) 0 var(--sp7)}
footer.site .shell{background:var(--card);border-radius:22px;display:flex;align-items:center;justify-content:space-between;padding:var(--sp4) var(--sp5)}
.fbrand{font-size:14px;font-weight:800}
.frole{font-size:12px;color:var(--ink-soft);margin-left:8px}

@media(max-width:960px){
  nav.main{display:none}
  header.site .shell{grid-template-columns:1fr auto}
  .b-contact-copy,.b-contact-form{grid-column:1/-1}
}
@media(max-width:600px){
  .card{padding:var(--sp4)}
  .b-empty{padding:var(--sp7) var(--sp4)}
  .field-row{grid-template-columns:1fr;gap:0;margin-bottom:0}
  .visual-card{aspect-ratio:4/3;padding:0}
}
</style>
</head>
<body>

<header class="site">
  <div class="shell">
    <div class="logo">한유조</div>
    <nav class="main">
      <a href="#project">포트폴리오</a>
      <a href="#contact">문의</a>
    </nav>
    <a href="#contact" class="cta-btn">문의하기 →</a>
  </div>
</header>

<section class="hero">
  <div class="shell">
    <span class="pill">PORTFOLIO</span>
    <h1>안녕하세요,<br>한유조입니다</h1>
    <p>초상권 웹사이트 개발 중</p>
    <div class="cta-row">
      <a href="#project" class="btn btn-dark">포트폴리오 보기 →</a>
      <a href="#contact" class="btn btn-ghost">문의하기</a>
    </div>
    <div class="card visual-card reveal">
      <img src="img/visual.jpg" alt="">
    </div>
  </div>
</section>

<section class="sec" id="project">
  <div class="shell">
    <div class="sec-center">
      <span class="pill">PORTFOLIO</span>
      <h2>주요 프로젝트</h2>
    </div>
    <div class="bento">
      <div class="card b-empty reveal">
        <span class="pill">COMING SOON</span>
        <h3>프로젝트 준비 중</h3>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="contact">
  <div class="shell">
    <div class="card">
      <div class="bento">
        <div class="b-contact-copy">
          <span class="pill" style="align-self:flex-start">CONTACT</span>
          <h3>함께 좋은<br>프로젝트를<br>만들어보세요.</h3>
          <p>프로젝트 또는 협업 문의를 남겨주세요.<br>빠르게 답변드리겠습니다.</p>
        </div>
        <form class="b-contact-form">
          <div class="field-row">
            <div class="field"><label>이름</label><input type="text" placeholder="이름을 입력해주세요."></div>
            <div class="field"><label>이메일</label><input type="email" placeholder="이메일을 입력해주세요."></div>
          </div>
          <div class="field"><label>문의 내용</label><textarea rows="5" placeholder="문의 내용을 입력해주세요."></textarea></div>
          <button type="submit" class="btn btn-dark" style="border:0;cursor:pointer">문의 보내기 →</button>
        </form>
      </div>
    </div>
  </div>
</section>

<footer class="site">
  <div class="shell">
    <div style="display:flex;align-items:baseline">
      <span class="fbrand">한유조</span><span class="frole">Portfolio</span>
    </div>
  </div>
</footer>

<script>
const els = document.querySelectorAll('.reveal');
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
}, {threshold:0.12});
els.forEach(el=>io.observe(el));
</script>

</body>
</html>
